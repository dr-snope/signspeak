<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MudraSetu - An Indian Sign Language Detector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/Logo.png" type="image/x-icon">
</head>
<body>
  <!-- Navigation -->
    <header class="navbar">
        <img class="logo" src="assets/Name_tag.png" alt="name tag">

        <nav>
            <a href="home.html" class="nav-link active">Home</a>
            <a href="how-it-works.html" class="nav-link">How It Works</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
    </header>

<!--Left box: camera-->
<div class="hero-container">
    <img class="appearence" src="assets/Front.png" alt="front image">
</div>

 <section class="translator">
      <div class="camera-panel">
        <video id="camera" autoplay playsinline muted hidden></video>
        <canvas id="canvas" hidden></canvas>
        <p id="camera-message">Your camera preview will appear here.</p>
        <button id="camera-button">Start Camera</button>
      </div>

      <div class="result-panel">
        <h2>Recognized sign</h2>
        <div id="result">Your translation will appear here.</div>
        <button id="copy-button">Copy result</button>
      </div>
 </section>

<br><br><br><br>
<!-- Mascot -->
<img class="mascot" src="assets/Signy.png" alt="Signy, the MudraSetu mascot">

<!-- How it works image -->
<div class="how-it-works-image">
    <img src="assets/How It Works_ Three Simple Steps.png" alt="How MudraSetu works">
</div>

<!-- Footer -->
<footer class="footer">
    <div class="footer-main">
        <div class="footer-brand">
            <h3>MudraSetu</h3>
            <p>An Indian Sign Language Detector</p>
        </div>

        <nav class="footer-links">
            <a href="home.html" style="font-size: 17px;">Home</a>
            <a href="how-it-works.html" style="font-size: 17px;">How it works</a>
            <a href="about.html" style="font-size: 17px;">About</a>
        </nav>
    </div>

    <div class="footer-bottom">
        <p>© 2026 MudraSetu (NexusHCI). A student innovation project.</p>
    </div>
</footer>

<script src="app.js"></script>
</body>

</html>
