<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignSpeak- An Indian Sign Language Detector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/Logo.png" type="image/x-icon">
</head>
<body>
    <!-- Logo -->    
<img class="logo" src="images/Name_tag.png" alt="name tag">

<!-- Navigation Bar -->
<nav class="navbar">
 <a href="home.html">Home</a> |
 <a href="how_it_works.html">How It Works</a> |
 <a href="about.html">About</a>  |
</nav>



<!--Left box: camera-->
<div class="hero-container"></div>
<img class="appearence" src="images/Front.png" alt="Logo">
</div>

 <section class="translator">
      <div class="camera-panel">
        <video id="camera" autoplay playsinline muted hidden></video>
        <p id="camera-message" style="color: black;">Your camera preview will appear here.</p>
        <button id="camera-button">Start Camera</button>
      </div>

      <div class="result-panel">
        <h2 style="color: black;">Recognized sign</h2>
        <p id="result" style="color: black;">Your translation will appear here.</p>
        <button id="copy-button">Copy result</button>
      </div>
    </section>
<br>
<br>
<br><br>
<!-- Mascot -->
<img class="mascot" src="images/Signy.png" alt="Signy, the SignSpeak mascot">

</body>

</html>
